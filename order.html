<!DOCTYPE html>
<html lang="en">
<head>
<!-- iTabs order forwarder: itabs.co/order?venue=alert4&name=...&drink=...
     sends the customer to https://alert4.itabs.co/order?name=...&drink=...
     (Gemini opens itabs.co links directly but wraps venue subdomains in a Google search.)
     Only forwards to *.itabs.co venue subdomains. -->
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>iTabs — opening your order</title>
<style>
  :root { --bg: #0d0d0d; --ink: #ffffff; --muted: #9a9a9a; --accent: #f5c400; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f4efe3; --ink: #13241f; --muted: #5f6f68; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 60px 16px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: var(--muted); line-height: 1.5; }
  a.btn { display: inline-block; margin-top: 16px; background: var(--accent); color: #1a1400; font-weight: 700; text-decoration: none; padding: 14px 22px; border-radius: 12px; }
</style>
</head>
<body>
<main>
  <h1 id="h">Opening your order…</h1>
  <p id="p">One moment.</p>
  <a class="btn" id="go" href="https://itabs.co/" hidden>Open my order</a>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var venue = (q.get("venue") || q.get("v") || "").toLowerCase().trim();
  if (!/^[a-z0-9][a-z0-9-]{0,40}$/.test(venue)) {
    document.getElementById("h").textContent = "This order link is missing the venue";
    document.getElementById("p").textContent = "Ask your assistant for the link again, or order on the venue's menu.";
    return;
  }
  q.delete("venue"); q.delete("v");
  var target = "https://" + venue + ".itabs.co/order?" + q.toString();
  var a = document.getElementById("go");
  a.href = target; a.hidden = false;
  location.replace(target);
})();
</script>
</body>
</html>
